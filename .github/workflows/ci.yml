name: App testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        run: |
          bash ./gradlew lint --stacktrace || { cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; exit 1; }
      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace
  apk:
    name: Generate APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Verify debug APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
      - name: Upload release APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
